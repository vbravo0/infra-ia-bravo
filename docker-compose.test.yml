services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cve_test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d cve_test_db"]
      interval: 1s
      timeout: 2s
      retries: 10

  test-runner:
    build:
      context: ./model
      dockerfile: Dockerfile.test
    environment:
      DATABASE_URL: postgresql://test_user:test_password@postgres-test:5432/cve_test_db
      MODEL_VERSION: test-sha
    depends_on:
      postgres-test:
        condition: service_healthy
