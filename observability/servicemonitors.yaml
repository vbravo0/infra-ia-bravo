# Observabilidad para el modelo CVE (Clase 6 y 8)
# Selecciona la etiqueta fija app.kubernetes.io/name del Service de nuestro modelo
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: model
  labels:
    app.kubernetes.io/name: model
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      app.kubernetes.io/name: model
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
