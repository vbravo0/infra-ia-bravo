# Class 8 (Caso integrador): Terraform + Helm para GKE en GCP
# Disparo manual con workflow_dispatch indicando el image_tag publicado por ci.yml
name: deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag publicado por ci.yml: el commit sha completo (nunca latest)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  AR_REPO: ${{ vars.AR_REPOSITORY || 'infra-cloud-template' }}
  IMAGE_TAG: ${{ inputs.image_tag }}

jobs:
  helm-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar tag de imagen
        run: |
          case "$IMAGE_TAG" in
            latest|"") echo "::error::image_tag no puede ser latest ni vacio"; exit 1 ;;
          esac

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: cve-cluster
          location: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}

      - uses: azure/setup-helm@v4

      - name: Desplegar en GKE via Helm
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/model"
          helm upgrade --install model helm/charts/model \
            --set image.repository="${IMAGE_URI}" \
            --set image.tag="${IMAGE_TAG}" \
            --wait --timeout 5m
          kubectl get pods,svc,hpa
