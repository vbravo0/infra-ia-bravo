name: CI/CD Pipeline - Eval & Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  evaluate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Clonar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. Instalar dependencias
        run: |
          pip install -r model/requirements.txt pytest pytest-asyncio

      - name: 4. Entrenar / Preparar artefacto (Build Time)
        run: |
          python model/train.py

      - name: 5. Tests Unitarios (Software / API)
        env:
          PYTHONPATH: ${{ github.workspace }}/model:${{ github.workspace }}
          MODEL_PATH: ${{ github.workspace }}/model.joblib
          PROMPT_PATH: ${{ github.workspace }}/model/prompts/system_prompt.txt
        run: |
          pytest model/tests/unit -v --disable-warnings

      - name: 6. Tests de Evaluacion (Contratos de Metricas y Estadistica)
        env:
          PYTHONPATH: ${{ github.workspace }}/model:${{ github.workspace }}
        run: |
          pytest model/tests/evaluation -v --disable-warnings

      - name: 7. Quality Gate (Eval Automatizada que frena el deploy)
        run: |
          # Si este script da error (exit 1), el pipeline SE FRENA ACA
          python evaluate.py

      - name: 8. Construir Imagen Docker (Solo si pasaron los tests y el Quality Gate)
        run: |
          TAG=$(git rev-parse --short HEAD)
          echo "Construyendo imagen con tag: $TAG"
          docker build --build-arg MODEL_VERSION=$TAG -f model/Dockerfile -t gcr.io/mi-proyecto/cve-model:$TAG .
